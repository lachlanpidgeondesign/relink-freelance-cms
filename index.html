<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzles</title>
  <!-- The platform's front door is platform.html (sign-in + role-based routing).
       This root page just forwards there, preserving any query/hash so invite and
       password-reset links (which land on the site root) still work. The <script>
       redirect runs first; the <meta> refresh is a no-JS fallback. -->
  <meta http-equiv="refresh" content="0; url=platform.html">
  <script>
    (function () {
      var target = 'platform.html' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a id="go" href="platform.html">the Puzzles platform</a>…</p>
  <script>
    document.getElementById('go').href =
      'platform.html' + window.location.search + window.location.hash;
  </script>
</body>
</html>
