<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relink — Submission Platform</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Minimal styling for the auth + stub views. The real design system arrives
       with the real UI in a later phase; this just keeps the scaffold legible. */
    :root {
      --bg: #f6f7f9; --card: #ffffff; --fg: #1a1a1e; --muted: #6b7280;
      --border: #e5e7eb; --primary: #4f46e5; --primary-fg: #ffffff;
      --error: #dc2626; --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
    }
    .app-loading { display: grid; place-items: center; min-height: 100vh; color: var(--muted); }

    /* Auth screen */
    .auth-screen { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .auth-card {
      width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .auth-title { margin: 0 0 4px; font-size: 26px; }
    .auth-subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .auth-form { display: flex; flex-direction: column; gap: 6px; }
    .auth-label { font-size: 13px; font-weight: 500; margin-top: 10px; }
    .auth-input {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit;
    }
    .auth-input:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
    .auth-actions { display: flex; gap: 8px; margin-top: 18px; }
    .auth-btn {
      flex: 1; padding: 10px 14px; border: 1px solid var(--border); background: var(--card);
      border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .auth-btn:hover { background: #f0f1f3; }
    .auth-btn:disabled { opacity: .6; cursor: default; }
    .auth-btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
    .auth-btn-primary:hover { background: #4338ca; }
    .auth-message { min-height: 18px; margin: 14px 0 0; font-size: 13px; }
    .auth-message-info { color: var(--muted); }
    .auth-message-error { color: var(--error); }
    .auth-link {
      align-self: flex-start; margin-top: 12px; padding: 0; border: 0; background: none;
      font: inherit; font-size: 13px; color: var(--primary); cursor: pointer; text-decoration: underline;
    }
    .auth-link:hover { color: #4338ca; }
    .auth-account { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
    .auth-account strong { color: var(--fg); font-weight: 600; }

    /* Signed-in shell */
    .app-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .app-brand { font-weight: 700; font-size: 18px; }
    .app-topbar-right { display: flex; align-items: center; gap: 12px; }
    .app-topbar-left { display: flex; align-items: center; gap: 20px; }
    .app-nav { display: flex; gap: 4px; }
    .app-nav-link {
      font: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
      background: transparent; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    }
    .app-nav-link:hover { background: #f0f1f3; color: var(--fg); }
    .app-nav-link.is-active { color: var(--primary); background: #eef2ff; }
    .app-user { color: var(--muted); font-size: 13px; }
    .app-role-badge {
      font-size: 12px; font-weight: 600; text-transform: capitalize;
      background: #eef2ff; color: var(--primary); padding: 3px 10px; border-radius: 999px;
    }
    .app-view { padding: 24px; max-width: 820px; margin: 0 auto; }
    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .view-header h2 { margin: 0; font-size: 20px; }
    .view-list { display: flex; flex-direction: column; gap: 8px; }
    .view-row {
      display: flex; align-items: center; gap: 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    }
    .view-row-title { flex: 1; font-weight: 500; display: flex; flex-direction: column; gap: 2px; }
    .view-row-submitted { font-size: 12px; font-weight: 400; color: var(--muted); }
    .view-row-state {
      font-size: 12px; color: var(--muted); text-transform: capitalize;
      background: #f3f4f6; padding: 2px 8px; border-radius: 999px;
    }
    .view-row-date { font-size: 13px; color: var(--muted); }
    .view-row-action { flex: 0 0 auto; }
    /* Unopened "New" notification badge on a queue row */
    .view-row.is-unopened { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
    .view-row-new {
      flex: 0 0 auto; font-size: 11px; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; color: var(--primary-fg); background: var(--primary);
      padding: 2px 8px; border-radius: 999px;
    }
    .view-empty, .view-error { color: var(--muted); font-size: 14px; }
    .view-error { color: var(--error); }

    /* Review / play-the-puzzle view */
    .btn-play {
      padding: 6px 16px; border: 1px solid var(--primary); background: var(--primary);
      color: var(--primary-fg); border-radius: 8px; font: inherit; font-weight: 600;
      font-size: 13px; cursor: pointer;
    }
    .btn-play:hover { background: #4338ca; }
    .view-header .review-title { flex: 1; }
    .review-stage {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; max-width: 640px; margin: 0 auto;
    }

    /* Queue grouped by state */
    .queue-groups { display: flex; flex-direction: column; gap: 24px; }
    .queue-group-title {
      display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
      font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: .03em;
    }
    .queue-group-count {
      font-size: 12px; font-weight: 600; background: #eef2ff; color: var(--primary);
      padding: 1px 8px; border-radius: 999px; text-transform: none; letter-spacing: 0;
    }
    .view-row-claim { font-size: 12px; color: var(--muted); }

    /* Admin / Team view */
    .admin-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 18px;
    }
    .admin-subhead { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    .admin-invite { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .admin-input, .admin-select {
      font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--card); color: var(--fg);
    }
    .admin-input { flex: 1 1 240px; }
    .admin-input:focus, .admin-select:focus {
      outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent;
    }
    .admin-msg { margin: 10px 0 0; font-size: 13px; }
    .admin-msg-info { color: var(--muted); }
    .admin-msg-ok { color: #15803d; }
    .admin-msg-error { color: var(--error); }
    .admin-users { display: flex; flex-direction: column; gap: 8px; }
    .admin-user {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
    }
    .admin-user-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .admin-user-email { font-weight: 500; }
    .admin-you {
      font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary);
      background: #eef2ff; padding: 1px 7px; border-radius: 999px; margin-left: 6px;
    }
    .admin-user-joined { font-size: 12px; color: var(--muted); }
    .admin-user-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .admin-row-msg { font-size: 12px; color: var(--muted); min-width: 46px; text-align: right; }
    .admin-row-msg-ok { color: #15803d; }
    .admin-row-msg-err { color: var(--error); }

    /* ===== Review workspace (wide, Figma-style) ============================ */
    .app-view.is-wide { max-width: 1240px; }

    /* Shared button kit */
    .btn-primary, .btn-ghost, .btn-danger, .btn-danger-ghost {
      font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
      padding: 9px 16px; border: 1px solid transparent; white-space: nowrap;
    }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .btn-ghost { background: var(--card); border-color: var(--border); color: var(--fg); }
    .btn-ghost:hover { background: #f0f1f3; }
    .btn-danger { background: var(--error); border-color: var(--error); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-danger:disabled { opacity: .5; cursor: default; }
    .btn-danger-ghost { background: var(--card); border-color: #f0d0d0; color: var(--error); }
    .btn-danger-ghost:hover { background: #fdf3f3; }

    /* Review nav bar */
    .review-nav {
      display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
      padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .review-nav-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .review-nav-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .review-nav-title {
      font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .review-nav-by { font-weight: 400; color: var(--muted); }
    .review-nav-by em { font-style: italic; color: var(--fg); }
    .btn-sm { padding: 7px 12px; font-size: 13px; }
    .state-pill {
      font-size: 12px; font-weight: 600; text-transform: capitalize; color: var(--primary);
      background: #eef2ff; padding: 4px 12px; border-radius: 999px;
    }

    /* Columns: Game (left, large) + Comments (right) */
    .review-workspace {
      display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 360px);
      gap: 18px; align-items: start;
    }
    .rcol {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    .rcol-play { padding: 0; background: transparent; border: 0; box-shadow: none; }
    .rcol-comments { display: flex; flex-direction: column; }
    .rcol-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .rcol-title { font-weight: 700; font-size: 15px; }
    .rcol-count {
      font-size: 12px; font-weight: 600; background: #f3f4f6; color: var(--muted);
      padding: 1px 9px; border-radius: 999px;
    }
    .rcol-loading { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }

    /* Game */
    .game-stage {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }

    /* Editing view: Edit | Play toggle + embedded composer */
    .view-toggle {
      display: inline-flex; background: #f3f4f6; border: 1px solid var(--border);
      border-radius: 999px; padding: 2px;
    }
    .view-toggle-btn {
      display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 600;
      font-size: 13px; padding: 5px 12px; border: 0; border-radius: 999px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .view-toggle-btn.is-active { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .rcol-compose { padding: 0; background: transparent; border: 0; box-shadow: none; }
    /* Slim toolbar above the puzzle/composer: Play|Edit on the left, Save on the right. */
    .panel-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; }
    /* Comments folded away → composer/game gets the full width. */
    .review-workspace.comments-collapsed { grid-template-columns: minmax(0, 1fr); }
    .review-workspace.comments-collapsed .rcol-comments { display: none; }
    .composer-frame {
      display: block; width: 100%; height: 78vh; min-height: 560px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    }

    /* Shared inputs */
    .review-textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font: inherit; background: var(--card); box-sizing: border-box; resize: vertical;
    }
    .review-textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
    .inline-msg { font-size: 12.5px; color: var(--muted); }
    .inline-msg-error { color: var(--error); }

    /* Decisions (in the nav) */
    .decisions { display: flex; flex-wrap: wrap; gap: 10px; }
    .decision-note { font-size: 13px; color: var(--muted); }
    .decision-msg { margin: 0 0 14px; font-size: 13px; }
    .decision-msg-error { color: var(--error); }

    /* Send-back modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100; background: rgba(17, 24, 39, .45);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      width: min(480px, 100%); background: var(--card); border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25); padding: 20px; max-height: 90vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal-title { margin: 0; font-size: 17px; }
    .modal-close {
      border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--muted);
      cursor: pointer; padding: 0 4px;
    }
    .modal-close:hover { color: var(--fg); }
    .modal-sub { margin: 4px 0 14px; font-size: 13px; color: var(--muted); }
    .modal-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .modal-foot-actions { display: flex; gap: 8px; margin-left: auto; }
    .sendback-history { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .sendback-history-label {
      font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
    }
    .sendback-entry { border: 1px solid #f0d6d6; background: #fdf6f6; border-radius: 8px; padding: 8px 10px; }

    /* Comments feed */
    .comment-feed {
      display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto;
      margin-bottom: 12px; padding-right: 2px;
    }
    .feed-empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .cmt { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--bg); }
    .cmt-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
    .cmt-author { font-weight: 600; color: var(--fg); }
    .cmt-time { margin-left: auto; }
    .cmt-body { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .general-form { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
    .general-foot { display: flex; align-items: center; gap: 10px; }

    @media (max-width: 900px) {
      .review-workspace, .review-workspace.comments-collapsed { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app-root"><div class="app-loading">Loading…</div></div>
  <script type="module" src="js/platform/main.js"></script>
</body>
</html>
